<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; color: #26261f; }
    a { color: #26261f; } a:hover { color: #000000; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  </style>
</helmet>

<div style="width: 1000px; height: 620px; background: #ececea; display: flex; flex-direction: column;">

  <div style="height: 52px; border-bottom: 1px solid #d6d6d2; background: #ffffff; display: flex; align-items: center; padding: 0 22px;">
    <div style="width: 66px; height: 13px; background: #26261f;"></div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center; padding: 46px 20px;">
    <div style="width: 460px; background: #ffffff; border: 1px solid #d6d6d2; padding: 32px 34px; display: flex; flex-direction: column; gap: 22px;">

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 22px; font-weight: 600; letter-spacing: -.02em;">Choose your password</div>
        
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div class="mono" style="font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #6d6d66;">New password</div>
        <div style="border: 1px solid #b4b4ae; padding: 11px 13px; font-size: 14px; letter-spacing: .18em; color: #6d6d66;">••••••••••••••</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div class="mono" style="font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #6d6d66;">Confirm</div>
        <div style="border: 1px solid #b4b4ae; padding: 11px 13px; font-size: 14px; letter-spacing: .18em; color: #6d6d66;">••••••••••••••</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #6d6d66;">
        <div style="display: flex; gap: 9px;"><span style="color: #26261f;">✓</span><span>At least 12 characters</span></div>
        <div style="display: flex; gap: 9px;"><span style="color: #26261f;">✓</span><span>Not a password you've used here before</span></div>
      </div>

      <div style="background: #f2f2f0; border-left: 2px solid #b4b4ae; padding: 10px 13px; font-size: 12px; line-height: 1.5; color: #6d6d66;">
        Signing in elsewhere? Setting this password ends every other session on your account.
      </div>

      <div style="display: flex; justify-content: flex-end; border-top: 1px solid #ececea; padding-top: 16px;">
        <div style="font-size: 14px; font-weight: 500; padding: 10px 24px; background: #26261f; color: #ffffff;">Save and continue</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
