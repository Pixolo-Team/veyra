<!doctype html>

      <div style="display: flex; flex-direction: column; gap: 6px;">

      <div style="display: flex; flex-direction: column; gap: 7px;">

      </div>

      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="font-size: 12.5px; color: #6d6d66;">Need a new one?</div>
        <div style="margin-left: auto; font-size: 14px; font-weight: 500; padding: 10px 24px; background: #26261f; color: #ffffff;">Sign in</div>
